name: Windows validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Data and release checks
        run: dotnet run --project Tests/ArchiveChecks.csproj
      - name: Desktop build
        run: dotnet build "digital heritage preservation app.csproj" -c Release -p:Platform=x64
      - name: API build
        run: dotnet build digital-heritage-api.csproj -c Release
      - name: Install installer compiler
        run: choco install innosetup --no-progress -y
      - name: Build development installer
        shell: pwsh
        run: ./Packaging/Build-Installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Lorevia-development-installer
          path: artifacts/installer/*
